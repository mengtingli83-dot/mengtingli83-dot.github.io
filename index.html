<title>Mengting Li Portfolio</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@300;400;500;600&amp;family=Geist+Mono:wght@400;500&amp;display=swap">
<meta name="description" content="Mengting Li: game artist working in 2D and 3D. Character design, illustration, texturing and game worlds.">

</head><body><style id="site-style">
/* Layout: quiet dark gallery. Neutral frame so every project's own palette reads true: large name, text-left/image-right work rows, hover-preview list, two-column about, plain contact list. */
:root{
  --bg:#0a0a0a; --panel:#141414; --fg:#ededeb; --muted:#8a8a87; --faint:#5c5c5a; --line:#232322;
  --hl:#ededeb; --danger:#ef6a5f; color-scheme:dark;
  --sans:"Geist",system-ui,-apple-system,"Segoe UI","PingFang SC","Hiragino Sans GB","Noto Sans SC","Microsoft YaHei",sans-serif;
  --mono:"Geist Mono",ui-monospace,Menlo,"PingFang SC","Noto Sans SC","Microsoft YaHei",monospace;
  --w:1200px;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html{scroll-behavior:smooth}
body{background:var(--bg);color:var(--fg);font-family:var(--sans);font-size:16px;line-height:1.6;font-weight:400;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
body.editing{padding-bottom:96px}
::selection{background:var(--fg);color:var(--bg)}
a{color:inherit}
:focus-visible{outline:2px solid var(--fg);outline-offset:3px}
.mono{font-family:var(--mono);font-size:12px;letter-spacing:.02em;text-transform:uppercase}
.muted{color:var(--muted)}
.acc{color:var(--fg)}
p{margin:0}
.wrap{max-width:var(--w);margin:0 auto}
main.wrap{overflow-x:clip}

/* nav */
.nav{position:sticky;top:env(safe-area-inset-top,0px);z-index:10;background:color-mix(in srgb,var(--bg) 85%,transparent);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border-bottom:1px solid var(--line);
  margin-left:calc(-1 * max(16px,env(safe-area-inset-left,0px)));margin-right:calc(-1 * max(16px,env(safe-area-inset-right,0px)))}
.nav .in{max-width:var(--w);margin:0 auto;display:flex;align-items:center;justify-content:space-between;gap:16px;padding:16px max(16px,env(safe-area-inset-right,0px)) 16px max(16px,env(safe-area-inset-left,0px));flex-wrap:wrap}
.nav .nm{font-weight:500;font-size:15px;text-decoration:none;letter-spacing:-.01em}
.nav ul{display:flex;gap:24px;list-style:none;margin:0;padding:0}
.nav ul a{text-decoration:none;color:var(--muted);transition:color .15s}
.nav ul a:hover{color:var(--fg)}
.dot{display:inline-flex;align-items:center;gap:8px;color:var(--muted)}
.dot::before{content:"";width:6px;height:6px;border-radius:50%;background:#6fcf8e}
@media (max-width:640px){.nav .dot{display:none}.nav ul{gap:16px}}

/* hero */
.hero{padding-block:clamp(64px,10vw,128px) clamp(56px,8vw,96px);display:grid;gap:36px;border-bottom:1px solid var(--line)}
.hero-top{display:flex;gap:16px;flex-wrap:wrap;color:var(--muted)}
.big{font-weight:500;letter-spacing:-.045em;line-height:.92;margin:0;font-size:clamp(60px,11.5vw,156px);overflow-wrap:anywhere}
.hero-bot{display:grid;grid-template-columns:minmax(0,1.4fr) minmax(0,1fr);gap:32px;align-items:end}
.tag{font-size:clamp(20px,2.2vw,26px);line-height:1.35;color:var(--muted);max-width:34ch;font-weight:300;letter-spacing:-.01em}
.roles{display:grid;gap:14px;justify-items:end;text-align:right;color:var(--muted)}
.roles .r1{color:var(--fg)}
@media (max-width:760px){.hero-bot{grid-template-columns:1fr}.roles{justify-items:start;text-align:left}}
@media (prefers-reduced-motion:no-preference){.hero>*{animation:fade .8s cubic-bezier(.2,.7,.1,1) both}.hero>*:nth-child(2){animation-delay:.06s}.hero>*:nth-child(3){animation-delay:.14s}}
@keyframes fade{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}

/* section heads */
section{padding-block:96px 0;scroll-margin-top:64px}
#top{scroll-margin-top:80px}
.sh{display:flex;justify-content:space-between;align-items:baseline;gap:20px;flex-wrap:wrap;margin-bottom:48px}
.sh h2{font-weight:500;letter-spacing:-.03em;font-size:clamp(32px,4.4vw,52px);line-height:1;margin:0}
.sh h2 em{font-style:normal;color:var(--faint)}
.sh .cnt{color:var(--muted)}
.filter{display:flex;gap:4px;border:1px solid var(--line);border-radius:999px;padding:3px;flex-wrap:wrap}
.filter .fc{opacity:.55;margin-left:2px;font-variant-numeric:tabular-nums}
@media (max-width:640px){.filter{border-radius:14px}}
.tags{display:flex;flex-wrap:wrap;gap:6px}
.tag{font:400 13px var(--sans);color:var(--muted);border:1px solid var(--line);border-radius:999px;padding:3px 10px}
.ctl.on{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.filter button{font-family:var(--mono);font-size:12px;text-transform:uppercase;border:0;background:none;color:var(--muted);padding:6px 14px;border-radius:999px;cursor:pointer}
.filter button[aria-pressed="true"]{background:var(--fg);color:var(--bg)}

/* work rows */
.works{display:grid;gap:clamp(56px,8vw,96px)}
.w-row{display:grid;grid-template-columns:minmax(0,5fr) minmax(0,7fr);gap:clamp(24px,5vw,64px);align-items:center;border-top:1px solid var(--line);padding-top:clamp(24px,3vw,36px)}
.w-row .frame{order:2}
.w-txt{display:grid;gap:14px;align-content:center;min-width:0}
.w-txt .file{display:flex;justify-content:space-between;gap:10px;color:var(--muted)}
.w-txt h3{font-weight:500;letter-spacing:-.03em;font-size:clamp(32px,3.6vw,46px);line-height:1.02;margin:0;text-wrap:balance}
.w-txt h3 a{text-decoration:none}
.w-txt .sub{font-size:18px;line-height:1.45;color:var(--muted);max-width:36ch}
.w-txt .facts{display:flex;gap:6px 16px;flex-wrap:wrap;color:var(--faint)}
.go{display:inline-flex;align-items:center;gap:8px;text-decoration:none;width:max-content;font-size:15px;color:var(--fg);border-bottom:1px solid var(--line);padding-bottom:3px;transition:gap .2s,border-color .2s}
.go:hover{gap:14px;border-color:var(--fg)}
.frame{position:relative}
.w-img{display:block;overflow:hidden;border-radius:4px}
.w-img .shot{aspect-ratio:16/10;transition:transform .8s cubic-bezier(.2,.7,.1,1)}
.w-img:hover .shot{transform:scale(1.025)}
@media (max-width:820px){.w-row{grid-template-columns:1fr}.w-row .frame{order:0}}

.shot{aspect-ratio:4/3;max-width:100%;position:relative;overflow:hidden;background:var(--panel)}
.shot img{width:100%;height:100%;object-fit:cover;display:block}
.ph{position:absolute;inset:0;display:grid;place-items:end start;padding:14px;color:var(--muted)}
.ph span{font-family:var(--mono);font-size:11px;text-transform:uppercase;letter-spacing:.04em}

/* list */
.titles{display:grid;border-top:1px solid var(--line)}
.t-row{display:grid;grid-template-columns:120px minmax(0,1fr) minmax(0,auto);gap:24px;padding-block:22px;border-bottom:1px solid var(--line);align-items:baseline;text-decoration:none;transition:padding .25s}
a.t-row:hover{padding-left:10px}
.t-row b{font-weight:500;letter-spacing:-.02em;font-size:clamp(22px,2.4vw,28px);line-height:1.15;display:block}
.t-row .d{color:var(--muted);font-size:15px;display:block;margin-top:4px}
.t-row .r{color:var(--muted);text-align:right}
@media (max-width:640px){.t-row{grid-template-columns:1fr;gap:4px}.t-row .r{text-align:left}}
.prev{position:fixed;left:0;top:0;width:260px;z-index:12;pointer-events:none;border-radius:4px;overflow:hidden;box-shadow:0 20px 50px rgba(0,0,0,.6)}
.prev .shot{aspect-ratio:4/3}

/* about */
.about{display:grid;grid-template-columns:minmax(0,5fr) minmax(0,7fr);gap:clamp(32px,5vw,72px);align-items:start}
.clip .lead{font-size:clamp(22px,2.4vw,28px);line-height:1.35;letter-spacing:-.015em;font-weight:400}
.clip .by{display:none}
.about .rt{display:grid;gap:18px;align-content:start;min-width:0}
.about .rt>p{max-width:60ch;color:var(--muted)}
.edu{display:grid;border-top:1px solid var(--line);margin-top:8px}
.edu .t-row{grid-template-columns:110px minmax(0,1fr) auto;padding-block:16px}
.edu .t-row b{font-size:17px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chips span{font-size:14px;border:1px solid var(--line);border-radius:999px;padding:4px 12px;color:var(--muted)}
@media (max-width:820px){.about{grid-template-columns:1fr}}

/* contact */
.contact{padding-block:120px 32px}
.notice .k{display:block;color:var(--muted);margin-bottom:20px;font-family:var(--mono);font-size:12px;text-transform:uppercase}
.notice h2{font-weight:500;letter-spacing:-.045em;font-size:clamp(52px,10vw,136px);line-height:.95;margin:0 0 24px}
.notice .ct{font-size:clamp(18px,2vw,22px);line-height:1.45;color:var(--muted);max-width:40ch;margin-bottom:44px}
.c-links{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));border-top:1px solid var(--line)}
.c-links a,.c-links .lk{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:20px 2px;border-bottom:1px solid var(--line);text-decoration:none;font-size:20px;letter-spacing:-.01em;transition:color .2s}
.c-links a:hover{color:var(--muted)}
.c-links .lk{display:grid;gap:4px}
.c-links .lk small{font-family:var(--mono);font-size:11px;color:var(--muted);word-break:break-all}
.notice .thanks{margin-top:28px;color:var(--muted)}
footer{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;color:var(--muted);padding-block:28px 24px;border-top:1px solid var(--line);margin-top:64px}
footer a{text-decoration:none}

/* detail */
.d-top{display:flex;justify-content:space-between;align-items:center;gap:12px;padding-block:28px;color:var(--muted)}
.back{text-decoration:none;transition:color .15s}
.back:hover{color:var(--fg)}
.d-head{padding-block:32px 48px;display:grid;gap:18px}
.d-head .file{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;color:var(--muted)}
.d-head h1{font-weight:500;letter-spacing:-.045em;line-height:.95;margin:0;font-size:clamp(52px,9vw,124px);text-wrap:balance}
.d-head .subtitle{font-size:clamp(19px,2.2vw,24px);line-height:1.4;color:var(--muted);max-width:44ch;font-weight:300}
@media (prefers-reduced-motion:no-preference){.d-head{animation:fade .7s cubic-bezier(.2,.7,.1,1) both}}
.hero-shot{border-radius:4px;overflow:hidden}
.hero-shot .shot{aspect-ratio:var(--r,16/9)}
.meta{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:24px;border-bottom:1px solid var(--line);padding-block:32px 28px;margin:0}
.meta div{display:grid;gap:6px;min-width:0}
.meta dd{margin:0;font-size:17px}
.meta dt{color:var(--muted)}
.d-body{display:grid;grid-template-columns:minmax(0,4fr) minmax(0,8fr);gap:28px clamp(24px,5vw,72px);padding-block:56px}
.d-body h2{margin:0;color:var(--muted);padding-top:5px}
.d-body .txt{display:grid;gap:16px;max-width:62ch;min-width:0;font-size:17px;color:#cfcfcc}
.d-body .txt.first p:first-child{font-size:clamp(20px,2.1vw,24px);line-height:1.4;color:var(--fg);letter-spacing:-.01em}
@media (max-width:700px){.d-body{grid-template-columns:1fr;gap:12px}.d-body .txt{margin-bottom:24px}}
.gal{display:grid;grid-template-columns:repeat(12,minmax(0,1fr));gap:12px;align-items:start}
.gal .it{display:grid;gap:8px;min-width:0;grid-column:span var(--span,6)}
.gal .it .shot{aspect-ratio:var(--r,4/3)}
.gal .it .zoom,.gal .it>.shot{border-radius:4px;overflow:hidden}
.gal .gh,.vclips .gh{grid-column:1/-1;display:flex;align-items:baseline;gap:14px;padding-top:28px;border-top:1px solid var(--line);margin-top:20px;color:var(--muted)}
.gal .gh:first-child{margin-top:0}
.gal .gh b,.vclips .gh b{color:var(--fg);font-weight:500;font-size:20px;letter-spacing:-.01em;font-family:var(--sans);text-transform:none}
@media (max-width:640px){.gal .it{grid-column:span var(--mspan,12)}}
.zoom{all:unset;cursor:zoom-in;display:block;width:100%;overflow:hidden}
.zoom .shot{transition:transform .7s cubic-bezier(.2,.7,.1,1)}
.zoom:hover .shot{transform:scale(1.015)}
.zoom:focus-visible{outline:2px solid var(--fg);outline-offset:3px}
.vclips{display:grid;gap:16px;margin-top:20px}
.vclip{display:grid;gap:10px;min-width:0}
.vclip video{display:block;width:100%;max-width:100%;aspect-ratio:16/9;background:#000;border-radius:4px}
.ytc{display:block;color:inherit;text-decoration:none}.ytt{position:relative;display:block;aspect-ratio:var(--r);overflow:hidden;background:#151515}.ytt img{width:100%;height:100%;object-fit:cover;display:block;transition:transform .5s,filter .3s;filter:brightness(.75)}.ytc:hover .ytt img{transform:scale(1.02);filter:brightness(.9)}.ytp{position:absolute;left:50%;top:50%;width:76px;height:76px;margin:-38px 0 0 -38px;border-radius:50%;background:rgba(10,10,10,.6);border:1px solid rgba(255,255,255,.5);backdrop-filter:blur(6px)}.ytp:after{content:"";position:absolute;left:31px;top:25px;border-style:solid;border-width:13px 0 13px 21px;border-color:transparent transparent transparent #fff}.ytc .cap{display:block;margin-top:10px;font-size:13px;color:var(--muted)}.ytc:hover .cap{color:var(--fg)}.btn.play{margin:-8px 0 32px}.btn{display:inline-flex;gap:8px;align-items:center;text-decoration:none;background:var(--fg);color:var(--bg);border-radius:999px;padding:10px 20px;font-weight:500;font-size:15px;width:max-content}
.btn:hover{background:#fff}
.next{display:grid;gap:10px;text-decoration:none;border-top:1px solid var(--line);margin-top:96px;padding-block:40px 24px}
.next b{font-weight:500;letter-spacing:-.045em;font-size:clamp(44px,8vw,104px);line-height:.95;transition:color .2s}
.next:hover b{color:var(--muted)}

/* interactive deck */
.deck{margin-top:40px;display:grid;gap:16px}
.deck-head{display:flex;justify-content:space-between;align-items:end;gap:16px;flex-wrap:wrap}
.deck-hint{color:var(--muted);font-size:15px;margin-top:6px;max-width:52ch}
.deck-btns{display:flex;gap:6px;flex-wrap:wrap}
.table{--cw:clamp(78px,12.5vw,158px);position:relative;height:calc(var(--cw) * 1.4773 + 150px);border-radius:6px;overflow:hidden;
  background:radial-gradient(ellipse 70% 90% at 50% 100%,#1d1d1c 0%,#121212 55%,#0c0c0c 100%);border:1px solid var(--line);touch-action:pan-y;user-select:none;-webkit-user-select:none}
.table::before{content:"";position:absolute;inset:0;background-image:radial-gradient(rgba(255,255,255,.035) 1px,transparent 1px);background-size:6px 6px;pointer-events:none}
.pc{position:absolute;left:0;top:0;width:var(--cw);aspect-ratio:375/554;cursor:grab;touch-action:none;will-change:transform;outline:none}
.pc:active{cursor:grabbing}
.pc-in{position:absolute;inset:0;border-radius:7px;overflow:hidden;isolation:isolate;backface-visibility:hidden;box-shadow:0 4px 10px rgba(0,0,0,.5);transition:box-shadow .2s}
.pc.lift .pc-in{box-shadow:0 22px 34px rgba(0,0,0,.65),0 0 0 1px rgba(255,255,255,.12)}
.pc:focus-visible .pc-in{box-shadow:0 0 0 2px var(--fg),0 22px 34px rgba(0,0,0,.65)}
.pc img{width:100%;height:100%;object-fit:cover;display:block;pointer-events:none}
.pc-shine{position:absolute;inset:0;pointer-events:none;opacity:0;transition:opacity .25s;mix-blend-mode:screen;
  background:radial-gradient(circle at var(--mx,50%) var(--my,30%),rgba(255,255,255,.38),rgba(255,255,255,0) 45%),
  linear-gradient(115deg,transparent 20%,rgba(255,120,200,.16) 36%,rgba(120,220,255,.18) 50%,rgba(255,240,140,.16) 64%,transparent 80%)}
.pc.lift .pc-shine{opacity:1}
.deck-info{display:flex;align-items:baseline;gap:6px 14px;flex-wrap:wrap;min-height:28px;font-size:16px}
.deck-info b{font-weight:500;font-size:20px;letter-spacing:-.01em}
.deck-info .cn{color:var(--muted)}


/* email */
.mail{display:flex;align-items:center;gap:14px;flex-wrap:wrap;margin-bottom:40px}
.mail-addr{font-size:clamp(22px,3vw,34px);letter-spacing:-.02em;user-select:all;-webkit-user-select:all;word-break:break-all}

/* captions */
.cap{color:var(--muted);font-size:14px;line-height:1.45;margin-top:2px;max-width:70ch}
.hero-shot + .cap{margin-top:10px}
.fcap{position:absolute;left:0;right:0;bottom:0;padding:28px 14px 12px;font-size:13px;line-height:1.35;color:#ededeb;background:linear-gradient(transparent,rgba(0,0,0,.72));pointer-events:none}

/* film strip */
.film-sec,.cmp-sec{margin-top:24px;display:grid;gap:18px}
.cmp-sec{margin-top:88px}
.film-head{display:flex;justify-content:space-between;align-items:end;gap:16px;flex-wrap:wrap}
.film-head h2{font-weight:500;letter-spacing:-.03em;font-size:clamp(28px,3.6vw,40px);line-height:1.05;margin:6px 0 0}
.film-ctl{display:flex;align-items:center;gap:8px}
.film-ctl .mono{min-width:6ch;text-align:right;font-variant-numeric:tabular-nums}
.film-btn{width:40px;height:40px;border-radius:50%;border:1px solid var(--line);background:none;color:var(--fg);font-size:16px;cursor:pointer}
.film-btn:hover{border-color:var(--fg)}
.film{display:flex;gap:12px;overflow-x:auto;scroll-snap-type:x mandatory;scrollbar-width:none;cursor:grab;outline:none;
  margin-right:calc(-1 * max(16px,env(safe-area-inset-right,0px)));padding-right:max(16px,env(safe-area-inset-right,0px))}
.film::-webkit-scrollbar{display:none}
.film.drag{scroll-snap-type:none;cursor:grabbing}
.film:focus-visible{outline:2px solid var(--fg);outline-offset:4px}
.fi{all:unset;position:relative;flex:0 0 auto;height:clamp(280px,56vh,560px);aspect-ratio:var(--r);max-width:86vw;scroll-snap-align:start;border-radius:4px;overflow:hidden;cursor:zoom-in;background:var(--panel)}
.film.drag .fi{cursor:grabbing}
.fi img{width:100%;height:100%;object-fit:cover;display:block;pointer-events:none;transition:transform .7s cubic-bezier(.2,.7,.1,1)}
.fi:hover img{transform:scale(1.025)}
.fi:focus-visible{outline:2px solid var(--fg);outline-offset:3px}
.film-bar{height:2px;background:var(--line);border-radius:2px;overflow:hidden}
.film-bar span{display:block;height:100%;width:20%;background:var(--fg);transition:width .15s}
/* screen to print */
.cmp{display:grid;gap:40px}
.cmp-row{--h:clamp(220px,40vw,440px);display:flex;flex-wrap:wrap;gap:14px 28px;align-items:flex-end;border-top:1px solid var(--line);padding-top:24px}
.cmp-col{display:grid;gap:10px;min-width:0;max-width:100%}
.cmp-row.two{--h:clamp(200px,29vw,350px)}
.cmp-cards{display:flex;gap:10px}
.cmp-cards img{height:var(--h);width:auto;aspect-ratio:375/554;object-fit:cover;border-radius:6px;box-shadow:0 14px 30px rgba(0,0,0,.5);display:block;max-width:100%}
.cmp-cards.n2 img{max-width:calc(50% - 5px)}
.cmp-photo{height:var(--h);aspect-ratio:var(--r);max-width:100%;border-radius:4px;overflow:hidden}
.cmp-photo img{width:100%;height:100%;object-fit:cover;display:block}
.cmp-cap{flex-basis:100%;display:flex;gap:6px 14px;flex-wrap:wrap;align-items:baseline}
.cmp-cap b{font-weight:500;font-size:18px}
@media (max-width:700px){.cmp-row{--h:min(300px,72vw)}.cmp-col{flex-basis:100%}.cmp-photo{height:auto;width:100%}}

/* mini hand cover */

<script>
const APP_SRC = document.currentScript.textContent;
const TITLE = "Mengting Li Portfolio";
const DATA = JSON.parse(document.getElementById("site-data").textContent);
let S = JSON.parse(JSON.stringify(DATA));
let editing = false, dirty = false, filter = "all", ART = null, ASSETS = null, saving = false;
const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

/* ---------- state paths ---------- */
const get = path => path.split(".").reduce((o,k)=>o==null?undefined:o[k], S);
function set(path, v){
  const ks = path.split("."); let o = S;
  ks.slice(0,-1).forEach(k=>{ if(o[k]==null) o[k] = {}; o = o[k]; });
  o[ks[ks.length-1]] = v;
}
/* editable text: plain in view mode, contenteditable in edit mode */
function E(path, tag="span", cls="", ph="Type here"){
  const ed = editing ? ` contenteditable="plaintext-only" spellcheck="false" data-ph="${esc(ph)}"` : "";
  return `<${tag} class="${cls}" data-k="${path}"${ed}>${esc(get(path))}</${tag}>`;
}
const C = (act, label, attrs="", cls="") => `<button class="ctl ${cls}" data-act="${act}" ${attrs}>${label}</button>`;

/* ---------- media ---------- */
const lbl = im => typeof im === "object" ? im.label : im;
const ph = (p,label) => `<div class="ph" style="background:radial-gradient(ellipse at 70% 30%, hsl(${p.hue} 12% 20%), transparent 60%), linear-gradient(160deg,#1b1b1a,#101010)"><span>${esc(label)} · placeholder</span></div>`;
const media = (p,im) => (im && typeof im === "object" && im.src) ? `<img src="${esc(im.src)}" alt="${esc(im.label||p.title)}" loading="lazy">` : ph(p, lbl(im) || "Image");

/* ---------- home ---------- */
/* a small fanned hand of cards used as the cover for card projects */
function miniHand(p){
  const pick = p.coverCards || [0, 1, 6, 8, 11];
  const cards = pick.filter(n => p.deck[n]).map(n => p.deck[n]), m = (cards.length - 1) / 2;
  return `<a class="w-img mh" href="#${p.id}" aria-label="${esc(p.title)}: open the interactive deck">
    <div class="shot mh-table">${cards.map((c,k)=>`<span class="mh-c" style="--o:${k - m};--d:${(k*0.37).toFixed(2)}s"><span class="mh-in"><img src="${esc(c.src)}" alt="" draggable="false" loading="lazy"><span class="pc-shine"></span></span></span>`).join("")}
    <span class="mh-tag mono">Interactive deck · ${p.deck.length} cards</span></div></a>`;
}
function paragraphs(path, cls=""){
  const arr = get(path) || [];
  return arr.map((_,j)=>E(`${path}.${j}`,"p",cls,"Paragraph")).join("") +
    (editing ? `<div class="ctls">${C("add-par","+ Paragraph",`data-k="${path}"`,"add")}</div>` : "");
}
function projCtls(i){
  const p = S.projects[i];
  return `<div class="ctls">${C("up","↑",`data-i="${i}"`)}${C("down","↓",`data-i="${i}"`)}
    ${p.group==="work" ? C("type",`Type: ${esc(p.type)}`,`data-i="${i}"`) : ""}
    ${p.group==="work" ? TAGS.map(t=>C("tag",`${(p.tags||[]).includes(t)?"✓ ":"+ "}${esc(t)}`,`data-i="${i}" data-t="${esc(t)}"`,(p.tags||[]).includes(t)?"on":"")).join("") : ""}
    ${C("move", p.group==="work" ? "Move to More" : "Move to Work", `data-i="${i}"`)}
    ${C("del","Delete",`data-i="${i}"`,"warn")}</div>`;
}
const THEMES = {"":"Neutral", noir:"Noir red", parchment:"Parchment & gold", hearth:"Warm hearth", abyss:"Bioluminescent"};
const TAGS = ["Concept Art","Texture Art","3D Environment","Illustration"];
const pad2 = n => String(n).padStart(2,"0");
/* torn paper edge: a jagged clip-path, stable per seed */
function tear(seed, depth=7){
  let x = seed * 9301 + 49297; const rnd = () => (x = (x * 9301 + 49297) % 233280) / 233280;
  const top = [], bot = [];
  for(let p=0; p<=100; p+= 1.2 + rnd()*2.6){ top.push(`${p.toFixed(1)}% ${(rnd()*depth).toFixed(1)}px`); }
  top.push(`100% ${(rnd()*depth).toFixed(1)}px`);
  for(let p=100; p>=0; p-= 1.2 + rnd()*2.6){ bot.push(`${p.toFixed(1)}% calc(100% - ${(rnd()*depth).toFixed(1)}px)`); }
  bot.push(`0% calc(100% - ${(rnd()*depth).toFixed(1)}px)`);
  return `clip-path:polygon(${top.join(",")},${bot.join(",")})`;
}
function nav(){
  const P = S.profile;
  return `<nav class="nav"><div class="in">
    <a class="nm" href="#top">${esc(P.name)}</a>
    <ul class="mono"><li><a href="#works">Work</a></li><li><a href="#games">Games</a></li><li><a href="#about">About</a></li><li><a href="#contact">Contact</a></li></ul>
    <span class="mono dot">Open to work</span>
    <span class="nav-tools">${editing ? "" : `<span class="lang-seg mono" role="group" aria-label="Language"><button data-lang="en">EN</button><button data-lang="zh">中文</button><button data-lang="da">DA</button></span>`}<button class="thm-btn" aria-label="Light mode"><svg viewBox="0 0 24 24" width="16" height="16" aria-hidden="true"><circle cx="12" cy="12" r="8.5" fill="none" stroke="currentColor" stroke-width="1.6"/><path d="M12 3.5a8.5 8.5 0 0 1 0 17z" fill="currentColor"/></svg></button></span>
  </div></nav>`;
}
function renderHome(){
  const P = S.profile;
  const work = S.projects.map((p,i)=>({p,i})).filter(x=>x.p.group==="work");
  const more = S.projects.map((p,i)=>({p,i})).filter(x=>x.p.group==="more");
  const shown = work.filter(x=>filter==="all"||x.p.type===filter);
  const rows = shown.map(({p,i})=>{
    const no = work.findIndex(x=>x.i===i) + 1;
    const facts = [p.meta.Timeframe, p.meta.Engine || p.meta.Tools].filter(Boolean);
    return `<article class="w-row">
      <div class="w-txt">
        <div class="file mono">${E(`projects.${i}.kind`,"span")}${E(`projects.${i}.meta.Year`,"span","","Year")}</div>
        ${editing ? E(`projects.${i}.title`,"h3") : `<h3><a href="#${p.id}">${esc(p.title)}</a></h3>`}
        ${E(`projects.${i}.subtitle`,"p","sub")}
        ${!editing && (p.tags||[]).length ? `<div class="tags" aria-label="Disciplines">${p.tags.map(t=>`<span class="tag">${esc(t)}</span>`).join("")}</div>` : ""}
        ${!editing && facts.length ? `<div class="facts mono">${facts.map(f=>`<span>${esc(f)}</span>`).join("")}</div>` : ""}
        <a class="go" href="#${p.id}">${editing?"Open to edit details":"View project"} <span>→</span></a>
        ${editing ? projCtls(i) : ""}
      </div>

/* ---------- interactive card deck (Archetype Mirror) ---------- */
const reduceMotion = matchMedia("(prefers-reduced-motion: reduce)").matches;
let DK = null;
function deckHTML(p){
  return `<section class="deck" aria-label="Interactive card deck">
    <div class="deck-head">
      <div><span class="mono muted">Interactive deck · ${p.deck.length} cards</span>
      <p class="deck-hint">Drag cards to rearrange your hand. Click a card to bring it up close.</p></div>
      <div class="deck-btns"><button class="ctl" id="dkShuffle">Shuffle</button><button class="ctl" id="dkSort">Sort I–XII</button></div>
    </div>
    <div class="table" id="dkTable">
      ${p.deck.map((c,n)=>`<div class="pc" data-c="${n}" tabindex="0" role="button" aria-label="${esc(c.num)} ${esc(c.name)}">
        <div class="pc-in"><img src="${esc(c.src)}" alt="" draggable="false"><span class="pc-shine"></span></div></div>`).join("")}
    </div>
    <div class="deck-info" id="dkInfo" aria-live="polite"><span class="mono muted">Hover a card</span></div>
  </section>`;
}
function initDeck(p){
  if(DK) cancelAnimationFrame(DK.raf);
  const table = $("#dkTable"); if(!table) return;
  const els = [...table.querySelectorAll(".pc")];
  DK = {p, table, order: els.map((_,n)=>n), sel: new Set(), hover: -1, drag: null, raf: 0,
    cards: els.map((el,n)=>({el, inner: el.querySelector(".pc-in"), shine: el.querySelector(".pc-shine"),
      x: 0, y: 0, r: 0, s: 1, tx: 0, ty: 0, tr: 0, ts: 1, rx: 0, ry: 0, trx: 0, try_: 0, vr: 0, ph: n*1.7, born: false}))};
  const info = c => { const d = p.deck[c];
    $("#dkInfo").innerHTML = `<span class="mono">${esc(d.num)}</span><b>${esc(d.name)}</b><span class="cn">${esc(d.cn)}</span><span class="muted">${esc(d.motto)}</span>`; };
  function layout(){
    const W = table.clientWidth, cw = els[0].offsetWidth, ch = els[0].offsetHeight, n = DK.order.length;
    const step = Math.min(cw * 0.86, (W - cw * 1.6) / Math.max(1, n - 1));
    const ang = Math.min(3.4, 36 / n);
    DK.order.forEach((c, k) => {
      const o = k - (n - 1) / 2, C = DK.cards[c];
      C.tx = W/2 - cw/2 + o * step;
      C.ty = table.clientHeight - ch - 72 + Math.pow(Math.abs(o), 2) * 1.2 - (DK.sel.has(c) ? 46 : 0) - (DK.hover === c ? 22 : 0);
      C.tr = o * ang; C.ts = DK.hover === c ? 1.1 : 1;
      C.slot = C.tx;
      if(!C.born){ C.x = W/2 - cw/2; C.y = table.clientHeight + 40; C.r = 0; C.born = true; }
    });
  }
  DK.layout = layout;
  function frame(t){
    if(!table.isConnected){ DK = null; return; }
    layout();
    const k = reduceMotion ? 1 : 0.16;
    DK.order.forEach((c, z) => {
      const C = DK.cards[c], dragging = DK.drag && DK.drag.c === c && DK.drag.moved;
      if(!dragging){
        C.x += (C.tx - C.x) * k; C.y += (C.ty - C.y) * k;
        C.r += (C.tr - C.r) * k; C.vr *= 0.85;
      }
      C.s += (C.ts - C.s) * (reduceMotion ? 1 : 0.2);
      C.rx += (C.trx - C.rx) * 0.15; C.ry += (C.try_ - C.ry) * 0.15;
      const bob = reduceMotion || dragging ? 0 : Math.sin(t/900 + C.ph) * 2.2;
      const sway = reduceMotion || dragging ? 0 : Math.sin(t/1300 + C.ph) * 0.9;
      C.el.style.transform = `translate(${C.x}px,${C.y + bob}px) rotate(${C.r + C.vr + sway}deg)`;
      C.el.style.zIndex = dragging ? 200 : (DK.hover === c ? 100 : z + 1);
      C.inner.style.transform = `perspective(700px) rotateX(${C.rx}deg) rotateY(${C.ry}deg) scale(${dragging ? 1.12 : C.s})`;
      C.el.classList.toggle("lift", dragging || DK.hover === c || DK.sel.has(c));
    });
    DK.raf = requestAnimationFrame(frame);
  }
  els.forEach((el, c) => {
    const C = DK.cards[c];
    el.addEventListener("pointerenter", () => { if(!DK.drag){ DK.hover = c; info(c); } });
    el.addEventListener("pointerleave", () => { if(DK.hover === c && !DK.drag) DK.hover = -1; C.trx = C.try_ = 0; });
    el.addEventListener("pointermove", e => {
      if(reduceMotion || (DK.drag && DK.drag.moved)) return;
      const r = C.inner.getBoundingClientRect(), px = (e.clientX - r.left) / r.width, py = (e.clientY - r.top) / r.height;
      C.trx = (0.5 - py) * 22; C.try_ = (px - 0.5) * 26;
      C.shine.style.setProperty("--mx", (px*100) + "%"); C.shine.style.setProperty("--my", (py*100) + "%");
    });
    el.addEventListener("pointerdown", e => {
      if(e.button > 0) return;
      el.setPointerCapture(e.pointerId);
      const tr = table.getBoundingClientRect();
      DK.drag = {c, id: e.pointerId, ox: e.clientX - tr.left - C.x, oy: e.clientY - tr.top - C.y, sx: e.clientX, sy: e.clientY, lx: e.clientX, moved: false};
    });
    el.addEventListener("pointermove", e => {
      const D = DK.drag; if(!D || D.c !== c || D.id !== e.pointerId) return;
      if(!D.moved && Math.hypot(e.clientX - D.sx, e.clientY - D.sy) > 6){ D.moved = true; DK.hover = c; C.trx = C.try_ = 0; }
      if(!D.moved) return;
      const tr = table.getBoundingClientRect();
      C.x = e.clientX - tr.left - D.ox; C.y = e.clientY - tr.top - D.oy;
      const vx = e.clientX - D.lx; D.lx = e.clientX;
      C.r += (Math.max(-28, Math.min(28, vx * 1.6)) - C.r) * 0.25;
      /* live reorder: slot by horizontal position among the other cards */
      const others = DK.order.filter(o => o !== c);
      let idx = others.findIndex(o => DK.cards[o].slot + els[0].offsetWidth/2 > C.x + els[0].offsetWidth/2);
      if(idx < 0) idx = others.length;
      others.splice(idx, 0, c);
      if(others.join() !== DK.order.join()) DK.order = others;
    });
    const end = e => {
      const D = DK && DK.drag; if(!D || D.c !== c) return;
      DK.drag = null;
      if(!D.moved){ info(c); openCard(c); }
      if(!el.matches(":hover")) DK.hover = -1;
    };
    el.addEventListener("pointerup", end);
    el.addEventListener("pointercancel", end);
    el.addEventListener("keydown", e => { if(e.key === "Enter" || e.key === " "){ e.preventDefault(); openCard(c); } });
    el.addEventListener("focus", () => { DK.hover = c; info(c); });
    el.addEventListener("blur", () => { if(DK && DK.hover === c) DK.hover = -1; });
  });
  /* ---- close-up: the card flies from the hand to the camera ---- */
  let F = null;
  function targetRect(){
    const vw = innerWidth, vh = innerHeight, ratio = 375/554;
    const h = Math.min(vh * 0.68, (vw - 48) / ratio, 760), w = h * ratio;
    return {x: (vw - w)/2, y: Math.max(16, (vh - h)/2 - 46), w, h};
  }
  function openCard(c){
    if(F) return;
    const d = p.deck[c], src = DK.cards[c].el, r0 = src.getBoundingClientRect();
    const T = targetRect();
    const wrap = document.createElement("div"); wrap.className = "cf"; wrap.setAttribute("role","dialog"); wrap.setAttribute("aria-modal","true"); wrap.setAttribute("aria-label", d.name);
    wrap.innerHTML = `<div class="cf-bg"></div>
      <div class="cf-card" style="width:${T.w}px;height:${T.h}px"><div class="pc-in"><img src="${esc(d.src)}" alt="${esc(d.name)}" draggable="false"><span class="pc-shine"></span></div></div>
      <div class="cf-ui"><div class="cf-name"><span class="mono">${esc(d.num)}</span><b>${esc(d.name)}</b><span class="cn">${esc(d.cn)}</span></div>
      <p class="cf-motto">${esc(d.motto)}</p>
      <div class="cf-btns"><button data-cf="prev" aria-label="Previous card">←</button><button data-cf="close">Back to hand · Esc</button><button data-cf="next" aria-label="Next card">→</button></div></div>`;
    document.body.appendChild(wrap);
    document.documentElement.style.overflow = "hidden";
    const card = wrap.querySelector(".cf-card"), inner = card.querySelector(".pc-in"), shine = card.querySelector(".pc-shine");
    /* start from the hand card's on-screen box (bounding box of the rotated card ~ its centre and size) */
    const C = DK.cards[c], cw = src.offsetWidth, ch = src.offsetHeight;
    const cx0 = r0.left + r0.width/2, cy0 = r0.top + r0.height/2;
    F = {c, wrap, card, inner, shine, x: cx0 - cw/2, y: cy0 - ch/2, s: cw / T.w, r: C.r, rx: 0, ry: 0, trx: 0, try_: 0, flip: 0, T, closing: false, raf: 0};
    src.style.visibility = "hidden";
    requestAnimationFrame(() => wrap.classList.add("on"));
    const step = t => {
      if(!F) return;
      const T = F.T, k = reduceMotion ? 1 : 0.14;
      let tx = T.x, ty = T.y, ts = 1, tr = 0, tf = 0;
      if(F.closing){
        const r = DK.cards[F.c].el.getBoundingClientRect(), w = DK.cards[F.c].el.offsetWidth, h = DK.cards[F.c].el.offsetHeight;
        tx = r.left + r.width/2 - w/2; ty = r.top + r.height/2 - h/2; ts = w / T.w; tr = DK.cards[F.c].r; tf = 0;
      }
      F.x += (tx - F.x) * k; F.y += (ty - F.y) * k; F.s += (ts - F.s) * k; F.r += (tr - F.r) * k;
      F.flip += (tf - F.flip) * (reduceMotion ? 1 : 0.12);
      F.rx += (F.trx - F.rx) * 0.12; F.ry += (F.try_ - F.ry) * 0.12;
      const bob = F.closing || reduceMotion ? 0 : Math.sin(t/1100) * 6;
      card.style.transform = `translate(${F.x}px,${F.y + bob}px) scale(${F.s}) rotate(${F.r}deg)`;
      inner.style.transform = `perspective(1400px) rotateX(${F.rx}deg) rotateY(${F.ry + F.flip}deg)`;
      if(F.closing && Math.abs(F.x - tx) < 1.5 && Math.abs(F.y - ty) < 1.5 && Math.abs(F.s - ts) < 0.01){ finishClose(); return; }
      F.raf = requestAnimationFrame(step);
    };
    F.raf = requestAnimationFrame(step);
    card.addEventListener("pointermove", e => {
      if(reduceMotion || F.closing) return;
      const r = card.getBoundingClientRect(), px = (e.clientX - r.left)/r.width, py = (e.clientY - r.top)/r.height;
      F.trx = (0.5 - py) * 18; F.try_ = (px - 0.5) * 22;
      shine.style.setProperty("--mx", px*100 + "%"); shine.style.setProperty("--my", py*100 + "%");
    });
    card.addEventListener("pointerleave", () => { F.trx = F.try_ = 0; });
    card.addEventListener("click", closeCard);
    wrap.querySelector(".cf-bg").addEventListener("click", closeCard);
    wrap.querySelector(".cf-btns").addEventListener("click", e => {
      const b = e.target.closest("[data-cf]"); if(!b) return;
      if(b.dataset.cf === "close") closeCard(); else swapCard(b.dataset.cf === "next" ? 1 : -1);
    });
    wrap.querySelector('[data-cf="close"]').focus();
  }
  function swapCard(dir){
    if(!F || F.closing) return;
    const k = DK.order.indexOf(F.c), n = DK.order.length, c = DK.order[(k + dir + n) % n], d = p.deck[c];
    DK.cards[F.c].el.style.visibility = ""; DK.cards[c].el.style.visibility = "hidden";
    F.c = c; info(c);
    F.flip = reduceMotion ? 0 : dir * 85;   /* turns in edge-first toward the new face */

    F.wrap.querySelector(".cf-name").innerHTML = `<span class="mono">${esc(d.num)}</span><b>${esc(d.name)}</b><span class="cn">${esc(d.cn)}</span>`;
    F.wrap.querySelector(".cf-motto").textContent = d.motto;
    F.wrap.setAttribute("aria-label", d.name);
  }
  function closeCard(){
    if(!F || F.closing) return;
    F.closing = true; F.trx = F.try_ = 0; F.wrap.classList.remove("on");
    if(reduceMotion) finishClose();
  }
  function finishClose(){
    if(!F) return;
    cancelAnimationFrame(F.raf);
    DK.cards[F.c].el.style.visibility = "";
    const el = DK.cards[F.c].el;
    F.wrap.remove(); F = null;
    document.documentElement.style.overflow = "";
    el.focus({preventScroll:true});
  }
  DK.keys = e => {
    if(!F) return;
    if(e.key === "Escape") closeCard();
    else if(e.key === "ArrowRight") swapCard(1);
    else if(e.key === "ArrowLeft") swapCard(-1);
    else return;
    e.preventDefault();
  };
  DK.resize = () => { if(F) F.T = targetRect(); };
  DK.open = c => { info(c); openCard(c); };
  $("#dkShuffle").onclick = () => {
    const o = DK.order.slice();
    for(let i = o.length - 1; i > 0; i--){ const j = Math.floor(Math.random() * (i + 1)); [o[i], o[j]] = [o[j], o[i]]; }

  };

  layout();
  DK.raf = requestAnimationFrame(frame);
}

function initQuiz(p){
  const box = $("#qzBox"); if(!box) return;

  const tally = () => {
    const sc = new Array(p.deck.length).fill(0);

  };

    box.innerHTML = `<div class="qz-intro">

      <button class="btn" id="qzStart">Start the reading</button></div>`;

  }
  function ask(){
    const Q = QUIZ[step];
    box.innerHTML = `<div class="qz-q">
      <div class="qz-top mono"><span>Question ${step+1} / ${QUIZ.length}</span>
        ${step ? `<button class="qz-link" id="qzBack">← Back</button>` : ""}</div>

    function lastHit(c){ for(let i = picks.length-1; i >= 0; i--) if(QUIZ[i].a[picks[i]][1][c]) return i; return -1; }
    const c = rank[0], d = p.deck[c], also = rank.slice(1,3).map(x=>p.deck[x].name).join(" and ");

        <div class="qz-acts"><button class="btn" id="qzClose">See your card up close</button><button class="ctl" id="qzAgain">Take it again</button></div>
      </div></div>`;
    const open = () => { if(DK && DK.open) DK.open(c); };

    $("#qzAgain").onclick = () => { step = 0; picks = []; ask(); };

  }

}

/* pack gallery rows by each image's proportions: wide = full row, landscape = halves, portrait = thirds or quarters, no orphans */
function layoutGallery(){
  const gal = $(".gal"); if(!gal) return;
  const runs = []; let cur = null;
  [...gal.children].forEach(el => {
    if(!el.classList.contains("it")){ cur = null; return; }
    const r = parseFloat(el.style.getPropertyValue("--r")) || 4/3;
    const kind = r >= 1.55 ? "wide" : r < 0.9 ? "tall" : "mid";
    if(!cur || cur.kind !== kind){ cur = {kind, els: [], rs: []}; runs.push(cur); }
    cur.els.push(el); cur.rs.push(r);
  });
  runs.forEach(({kind, els, rs}) => {
    const n = els.length, set = (el, d, m) => { el.style.setProperty("--span", d); el.style.setProperty("--mspan", m); };
    if(kind === "wide") return els.forEach(el => set(el, 12, 12));
    if(kind === "mid"){
      els.forEach(el => set(el, 6, 12));
      if(n % 2 && rs[n-1] >= 1.15) set(els[n-1], 12, 12);
      return;
    }
    /* portrait: rows of 3; a remainder of 1 becomes a row of 4, a remainder of 2 a pair */
    els.forEach(el => set(el, 4, 6));
    if(n === 1) set(els[0], 6, 12);
    else if(n % 3 === 1) els.slice(0, 4).forEach(el => set(el, 3, 6));
    else if(n % 3 === 2) els.slice(0, 2).forEach(el => set(el, 6, 6));
  });
}
/* learn each image's real proportions so the gallery never crops it */
function measureImages(p){

  document.querySelectorAll(".gal .it[data-j] img, .hero-shot[data-j] img").forEach(img => {
    const box = img.closest("[data-j]"), j = +box.dataset.j;
    const apply = () => {
      if(!img.naturalWidth) return;
      const r = +(img.naturalWidth / img.naturalHeight).toFixed(3), im = p.images[j];
      box.style.setProperty("--r", r);
      if(box.classList.contains("it")) layoutGallery();
      if(im && typeof im === "object" && !im.r){ im.r = r; const d = DATA.projects.find(x=>x.id===p.id); const di = d && d.images.find(x=>x && x.src===im.src); if(di && !di.r) di.r = r; }
    };
    img.complete ? apply() : img.addEventListener("load", apply, {once:true});
  });
}

        : `Couldn't upload ${file.name}: ${err.message||err.code}`, true);

    }

});

/* ---------- lightbox: zoom, pan, prev/next ---------- */
let lastFocus, lbP = null, lbJ = 0;
const Z = {s:1, x:0, y:0, min:1, max:6};
const lbImg = () => $("#lbStage img");
function lbApply(anim){
  const im = lbImg(); if(!im) return;
  im.style.transition = anim ? "transform .22s cubic-bezier(.2,.7,.1,1)" : "none";
  im.style.transform = `translate(${Z.x}px,${Z.y}px) scale(${Z.s})`;
  $("#lbStage").classList.toggle("zoomed", Z.s > 1.01);
  $("#lbZoom").textContent = Math.round(Z.s*100) + "%";
}
function lbClamp(){
  const im = lbImg(), st = $("#lbStage"); if(!im) return;
  const mx = Math.max(0, (im.offsetWidth*Z.s - st.clientWidth)/2), my = Math.max(0, (im.offsetHeight*Z.s - st.clientHeight)/2);
  Z.x = Math.min(mx, Math.max(-mx, Z.x)); Z.y = Math.min(my, Math.max(-my, Z.y));
}
/* zoom to scale ns keeping the stage point (cx,cy) fixed; cx,cy measured from stage centre */
function lbZoomAt(ns, cx=0, cy=0, anim){
  ns = Math.min(Z.max, Math.max(Z.min, ns));
  Z.x = cx - (cx - Z.x) * (ns / Z.s); Z.y = cy - (cy - Z.y) * (ns / Z.s); Z.s = ns;
  if(ns <= 1.001){ Z.s = 1; Z.x = 0; Z.y = 0; }
  lbClamp(); lbApply(anim);
}
const lbReset = anim => { Z.s = 1; Z.x = 0; Z.y = 0; lbApply(anim); };
function stagePoint(e){ const r = $("#lbStage").getBoundingClientRect(); return [e.clientX - r.left - r.width/2, e.clientY - r.top - r.height/2]; }
function lbShow(j){
  const n = lbP.images.length; lbJ = (j + n) % n;
  const im = lbP.images[lbJ];
  $("#lbStage").innerHTML = (im && typeof im === "object" && im.src)
    ? `<img src="${esc(im.src)}" alt="${esc(im.label||lbP.title)}" draggable="false">`
    : `<div class="shot">${media(lbP, im)}</div>`;
  $("#lbCap").textContent = lbP.title + " — " + lbl(im);
  $("#lbCount").textContent = `${lbJ+1} / ${n}`;
  $("#lbPrev").hidden = $("#lbNext").hidden = n < 2;
  lbReset(false);
}
function openLb(p,j,el){
  lastFocus = el; lbP = p;
  $("#lb").hidden = false; document.documentElement.style.overflow = "hidden";
  lbShow(j); $("#lbClose").focus();
}
function closeLb(){ $("#lb").hidden = true; document.documentElement.style.overflow = ""; lbP = null; lastFocus && lastFocus.focus(); }
$("#lbClose").onclick = closeLb;
$("#lbPrev").onclick = ()=> lbShow(lbJ-1);
$("#lbNext").onclick = ()=> lbShow(lbJ+1);
$("#lbIn").onclick = ()=> lbZoomAt(Z.s*1.5, 0, 0, true);
$("#lbOut").onclick = ()=> lbZoomAt(Z.s/1.5, 0, 0, true);
$("#lbFit").onclick = ()=> lbReset(true);
let justMoved = 0;
function onImage(e){ const im = lbImg() || $("#lbStage .shot"); if(!im) return false; const r = im.getBoundingClientRect(); return e.clientX>=r.left && e.clientX<=r.right && e.clientY>=r.top && e.clientY<=r.bottom; }
$("#lb").addEventListener("click", e=>{
  if(Date.now() - justMoved < 300) return;
  if(e.target.id==="lb" || (e.target.id==="lbStage" && Z.s<=1.01 && !onImage(e))) closeLb();
});
addEventListener("keydown", e=>{
  if($("#lb").hidden) return;
  if(e.key==="Escape") closeLb();
  else if(e.key==="ArrowLeft") lbShow(lbJ-1);
  else if(e.key==="ArrowRight") lbShow(lbJ+1);
  else if(e.key==="+" || e.key==="=") lbZoomAt(Z.s*1.5,0,0,true);
  else if(e.key==="-") lbZoomAt(Z.s/1.5,0,0,true);
  else if(e.key==="0") lbReset(true);
  else return;
  e.preventDefault();
});
/* wheel / trackpad zoom */
$("#lbStage").addEventListener("wheel", e=>{
  if(!lbImg()) return;
  e.preventDefault();
  const [cx,cy] = stagePoint(e);
  lbZoomAt(Z.s * Math.exp(-e.deltaY * (e.ctrlKey ? 0.01 : 0.0022)), cx, cy, false);
}, {passive:false});
/* double click / double tap toggles zoom */
$("#lbStage").addEventListener("dblclick", e=>{
  if(!lbImg()) return;
  const [cx,cy] = stagePoint(e);
  Z.s > 1.01 ? lbReset(true) : lbZoomAt(2.5, cx, cy, true);
});
/* drag to pan, pinch to zoom, swipe to change image */
const ptrs = new Map(); let g = null;
$("#lbStage").addEventListener("pointerdown", e=>{
  if(!lbImg() || e.button>0) return;
  $("#lbStage").setPointerCapture(e.pointerId);
  ptrs.set(e.pointerId, [e.clientX, e.clientY]);
  if(ptrs.size === 2){
    const [a,b] = [...ptrs.values()];
    g = {pinch:true, d:Math.hypot(a[0]-b[0], a[1]-b[1]), s:Z.s, x:Z.x, y:Z.y, mid:stagePoint({clientX:(a[0]+b[0])/2, clientY:(a[1]+b[1])/2})};
  } else g = {pinch:false, sx:e.clientX, sy:e.clientY, x:Z.x, y:Z.y, t:Date.now(), moved:false};
});
$("#lbStage").addEventListener("pointermove", e=>{
  if(!ptrs.has(e.pointerId) || !g) return;
  ptrs.set(e.pointerId, [e.clientX, e.clientY]);
  if(g.pinch && ptrs.size === 2){
    const [a,b] = [...ptrs.values()], d = Math.hypot(a[0]-b[0], a[1]-b[1]);
    Z.s = g.s; Z.x = g.x; Z.y = g.y;
    lbZoomAt(g.s * d / g.d, g.mid[0], g.mid[1], false);
  } else if(!g.pinch){
    const dx = e.clientX - g.sx, dy = e.clientY - g.sy;
    if(Math.abs(dx)+Math.abs(dy) > 4) g.moved = true;
    if(Z.s > 1.01){ Z.x = g.x + dx; Z.y = g.y + dy; lbClamp(); lbApply(false); }
  }
});
function ptrEnd(e){
  if(!ptrs.has(e.pointerId)) return;
  ptrs.delete(e.pointerId);
  if(g && (g.moved || g.pinch)) justMoved = Date.now();
  if(g && !g.pinch && Z.s <= 1.01 && g.moved){
    const dx = e.clientX - g.sx, dy = e.clientY - g.sy;
    if(Math.abs(dx) > 60 && Math.abs(dx) > Math.abs(dy)*1.5 && Date.now()-g.t < 600) lbShow(lbJ + (dx < 0 ? 1 : -1));
  }
  if(ptrs.size === 0) g = null;
  else if(ptrs.size === 1){ const [p] = [...ptrs.values()]; g = {pinch:false, sx:p[0], sy:p[1], x:Z.x, y:Z.y, t:Date.now(), moved:true}; }
}
$("#lbStage").addEventListener("pointerup", ptrEnd);
$("#lbStage").addEventListener("pointercancel", ptrEnd);
addEventListener("resize", ()=>{ if(!$("#lb").hidden){ lbClamp(); lbApply(false); } });

/* ---------- edit mode + save ---------- */
let msg = "", msgSticky = false;
function status(t, sticky){ msg = t; msgSticky = !!sticky; updateBar(); }
function updateBar(){
  document.body.classList.toggle("editing", editing);
  $("#editFab").hidden = !ART || !ASSETS || editing;
  $("#editBar").hidden = !editing;
  if(!editing) return;
  $("#editSt").innerHTML = msg ? esc(msg) : dirty ? "<b>Unsaved changes.</b> Click any dashed text to edit it." : "Editing. Click any dashed text to change it.";
  $("#btnSave").disabled = !dirty || saving;
  $("#btnSave").textContent = saving ? "Saving…" : "Save";
  $("#btnDiscard").textContent = dirty ? "Discard" : "Done";
}
$("#editFab").onclick = ()=>{ editing = true; msg = ""; render(false); };
$("#btnDiscard").onclick = ()=>{
  S = JSON.parse(JSON.stringify(DATA)); dirty = false; editing = false; msg = "";
  if(!S.projects.some(p=>p.id===location.hash.slice(1)) && /^#project-/.test(location.hash)) location.hash = "works";
  render(false);
};
function cleaned(){
  const c = JSON.parse(JSON.stringify(S));
  const tidy = a => (a||[]).map(s=>String(s).trim()).filter(Boolean);
  c.profile.about = tidy(c.profile.about);
  c.projects.forEach(p=>{
    p.overview = tidy(p.overview); p.process = tidy(p.process);
    if(!p.process.length) delete p.process;
    if(p.tools!=null && !String(p.tools).trim()) delete p.tools;
    if(p.video!=null && !String(p.video).trim()) delete p.video;
  });
  return c;
}
const RESET_FALLBACK = ":root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}";

es for the truth.": "Visdom. Søger sandheden.", "The Innocent": "Den Uskyldige", "Faith. Longs for paradise.": "Tro. Længes efter paradis.", "The Everyman": "Den Almindelige", "Belonging. Connects with others.": "Fællesskab. Knytter bånd til andre.", "The Outlaw": "Oprøreren", "Liberation. Breaks the rules.": "Frigørelse. Bryder reglerne.", "The Lover": "Elskeren", "Passion. Follows the heart.": "Lidenskab. Følger hjertet.", "A free Saturday with no plans. You…": "En fri lørdag uden planer. Du…", "Head somewhere you've never been": "Tager et sted hen, du aldrig har været", "Make something: draw, cook, build": "Laver noget: tegner, laver mad, bygger", "Message friends to see what everyone's up to": "Skriver til vennerne for at høre, hvad de laver", "Go deep into a book or a new topic": "Fordyber dig i en bog eller et nyt emne", "← Back": "← Tilbage", "In a group project, you naturally…": "I et gruppeprojekt vil du helt naturligt…", "Take charge and set the plan": "Tage styringen og lægge planen", "Check that everyone is doing okay": "Sikre dig, at alle har det godt", "Keep the mood light": "Holde stemningen let", "Question the brief and try another way": "Stille spørgsmål ved opgaven og prøve en anden vej", "What would bother you most?": "Hvad ville genere dig mest?", "Being weak when it really matters": "At være svag, når det virkelig gælder", "Being stuck somewhere boring": "At sidde fast et kedeligt sted", "Being lied to": "At blive løjet for", "Being alone": "At være alene", "Pick a door.": "Vælg en dør.", "A garden in morning sun": "En have i morgensol", "A stage behind a red curtain": "En scene bag et rødt tæppe", "A hall with a throne at the end": "En sal med en trone for enden", "A forest path at night": "En skovsti om natten", "Friends usually come to you for…": "Dine venner kommer som regel til dig for at få…", "Advice": "Råd", "Comfort": "Trøst", "A laugh": "Et grin", "The push to do the scary thing": "Skubbet til at gøre det, der er skræmmende", "Which word would you most like to be remembered by?": "Hvilket ord vil du helst huskes for?", "Kind": "Venlig", "Brilliant": "Genial", "Brave": "Modig", "A rule makes no sense to you. You…": "En regel giver ingen mening for dig. Du…", "Follow it. There's probably a reason": "Følger den. Der er nok en grund", "Rewrite it so it works properly": "Omskriver den, så den virker ordentligt", "Ignore it": "Ignorerer den", "Find a clever way around it": "Finder en snedig vej udenom", "The best reward would be…": "Den bedste belønning ville være…", "A deep bond with someone": "Et dybt bånd til et andet menneske", "A place where everyone belongs": "Et sted, hvor alle hører til", "Seeing your idea become real": "At se din idé blive til virkelighed", "Freedom to go anywhere": "Frihed til at tage hvor som helst hen", "You drew": "Du trak", "See your card up close": "Se dit kort tæt på", "Take it again": "Tag den igen", "You see how things could be and quietly make them so. People find you a little mysterious, and that suits you.": "Du ser, hvordan tingene kunne være, og gør dem stille og roligt sådan. Folk synes, du er lidt mystisk, og det klæder dig.", "You bring light into heavy rooms. Under the jokes is a sharp eye for what everyone else takes too seriously.": "Du bringer lys ind i tunge rum. Under spøgen gemmer sig et skarpt blik for det, alle andre tager for alvorligt.", "You make order out of chaos. People feel safer when you're the one holding the map.": "Du skaber orden i kaos. Folk føler sig trygge, når det er dig, der holder kortet.", "You notice who needs help before they ask, and you give care without keeping score.": "Du opdager, hvem der har brug for hjælp, før de spørger, og du giver omsorg uden at føre regnskab.", "You think with your hands. A blank page isn't empty to you, it's an invitation.": "Du tænker med hænderne. Et blankt ark er ikke tomt for dig, det er en invitation.", "You trust the road more than the destination. Staying still too long feels like losing yourself.": "Du stoler mere på vejen end på målet. At stå stille for længe føles som at miste dig selv.", "You step forward when others step back. Hard things are where you find out who you are.": "Du træder frem, når andre træder tilbage. Det er i det svære, du finder ud af, hvem du er.", "You would rather understand than win. Good questions are your favourite kind of treasure.": "Du vil hellere forstå end vinde. Gode spørgsmål er din yndlingsskat.", "You believe the good in the world is real, and you help other people believe it too.": "Du tror på, at det gode i verden er virkeligt, og du hjælper andre med at tro på det.", "You make people feel they belong. Honest, steady and easy to trust.": "Du får folk til at føle, at de hører til. Ærlig, stabil og nem at stole på.", "You question the rules everyone else accepts. Change often starts with someone like you.": "Du stiller spørgsmål ved de regler, alle andre accepterer. Forandring begynder ofte med en som dig.", "You lead with the heart. Beauty, closeness and feeling are what make life worth living.": "Du lader hjertet lede. Skønhed, nærhed og følelser er det, der gør livet værd at leve.", "Key art with the animal lords": "Key art med dyrefyrsterne", "Timeframe": "Tidsramme", "Personal project": "Personligt projekt", "Tools": "Værktøjer", "The game is set in a war-torn animal kingdom, where lords of different regions have fought for power for decades.": "Spillet foregår i et krigshærget dyrerige, hvor fyrster fra forskellige egne har kæmpet om magten i årtier.", "Players take on the role of different lords to expand their territory and grow their power. Each lord has unique skills and architecture, and players use those traits to fight for the throne and win the game.": "Spillerne påtager sig rollen som forskellige fyrster, der udvider deres territorium og øger deres magt. Hver fyrste har unikke evner og bygninger, som spillerne bruger til at kæmpe om tronen og vinde spillet.", "Rules sheet: game goal, components and land event cards": "Regelark: spillets mål, komponenter og landbegivenhedskort", "Kingdom event cards and building tiles": "Rigets begivenhedskort og bygningsbrikker", "Lord sheet: Ishella, Knight": "Fyrsteark: Ishella, ridder", "Lord sheet: Grasiendi, Duke": "Fyrsteark: Grasiendi, hertug", "Lord sheet: Eydmork, Bandit": "Fyrsteark: Eydmork, bandit", "Lord sheet: Halendi, ENCHANIER": "Fyrsteark: Halendi, ENCHANIER", "Title screen: newspaper-collage menu with the raven key art": "Titelskærm: menu i aviscollage med ravne-key art", "Detective visual novel": "Detektiv-visual novel", "An indie project I'm currently developing, which began in last semester's Art Direction course. The story takes place at the beginning of the last century, when a detective is assigned to investigate a remote village.": "Et indie-projekt, jeg er ved at udvikle, og som begyndte på sidste semesters Art Direction-kursus. Historien foregår i begyndelsen af forrige århundrede, hvor en detektiv sendes ud for at efterforske en afsides landsby.", "Something strange has happened there: every villager wears a mask. What secrets are waiting for the detective to uncover?": "Der er sket noget mærkeligt: alle landsbyboere bærer maske. Hvilke hemmeligheder venter på at blive afsløret?", "The World": "Verdenen", "A remote village early last century, where every villager wears a mask": "En afsides landsby i begyndelsen af forrige århundrede, hvor alle bærer maske", "Poster with the tagline “This is our land”": "Plakat med sloganet “This is our land”", "Characters": "Karakterer", "The suspects, as the detective records them in the case file": "De mistænkte, som detektiven noterer dem i sagsmappen", "Case file, People tab: suspect portraits with handwritten notes": "Sagsmappe, fanen Personer: portrætter af de mistænkte med håndskrevne noter", "Investigation": "Efterforskning", "Collecting clues, visiting places and questioning villagers": "Indsamling af spor, besøg og afhøring af landsbyboere", "Case file, Places tab: taped photos and newspaper clippings": "Sagsmappe, fanen Steder: fastklistrede fotos og avisudklip", "Interrogation at the railway, in black-and-white paper collage": "Afhøring ved jernbanen i sort-hvid papircollage", "The Black Wing": "Den Sorte Vinge", "The final encounter": "Det endelige møde", "Boss encounter with the many-eyed Black Wing": "Bosskamp mod den mangeøjede Sorte Vinge", "The main screens side by side": "Hovedskærmene side om side", "The main screens together: title, dialogue, case file and boss encounter": "Hovedskærmene samlet: titel, dialog, sagsmappe og bosskamp", "Footage from the current build": "Optagelser fra den nuværende version", "Gameplay video": "Gameplayvideo", "Case of the Black Wing": "Sagen om Den Sorte Vinge", "Fight of the Throne": "Kampen om tronen", "Title screen: the lighthouse at night with the game menu": "Titelskærm: fyrtårnet om natten med spilmenuen", "Role": "Rolle", "CG Artist": "CG-kunstner", "17 people": "17 personer", "DADIU game production": "DADIU-spilproduktion", "Download on itch.io": "Download på itch.io", "Download on itch.io ↗": "Download på itch.io ↗", "A psychological maritime thriller set in 19th-century Denmark. You keep a lighthouse running through the night, feeding the stove, fixing the pump and keeping the light alive.": "En psykologisk maritim thriller fra 1800-tallets Danmark. Du holder et fyrtårn i gang natten igennem: fyrer i ovnen, reparerer pumpen og holder lyset tændt.", "My part: the key art poster, the character concept for the keeper, and a set of stylized 3D props, modelled and hand-textured, that furnish the lighthouse interior.": "Min del: key art-plakaten, karakterkonceptet til fyrmesteren og et sæt stiliserede 3D-rekvisitter, modelleret og håndteksturet, som indretter fyrtårnet.", "A poster built around the keeper and the light he carries": "En plakat bygget op om fyrmesteren og det lys, han bærer", "Key art poster: the lighthouse keeper, his pipe and the storm": "Key art-plakat: fy const I18N_PAT = [
  [/^All \((\d+)\)$/, {zh:m=>`全部 (${m[1]})`, da:m=>`Alle (${m[1]})`}],
  [/^(\d+) projects$/, {zh:m=>`${m[1]} 个项目`, da:m=>`${m[1]} projekter`}],
  [/^(\d+) cards$/, {zh:m=>`${m[1]} 张牌`, da:m=>`${m[1]} kort`}],
  [/^Question (\d+) \/ (\d+)$/, {zh:m=>`第 ${m[1]} / ${m[2]} 题`, da:m=>`Spørgsmål ${m[1]} / ${m[2]}`}],
  [/^Also strong in you: (.+) and (.+)\.$/, {zh:(m,D)=>`你身上同样鲜明的还有：${D[m[1]]||m[1]} 和 ${D[m[2]]||m[2]}。`, da:(m,D)=>`Også stærkt i dig: ${D[m[1]]||m[1]} og ${D[m[2]]||m[2]}.`}],
];
let LANG = "en";
try{ const l = localStorage.getItem("ml-lang"); if(l === "zh" || l === "da") LANG = l; }catch(_){}
const ORIG = new WeakMap();
function trStr(k){
  const D = I18N[LANG]; if(!D) return null;
  if(D[k] != null) return D[k];
  for(const [re, f] of I18N_PAT){ const m = k.match(re); if(m && f[LANG]) return f[LANG](m, D); }
  const parts = k.split(/( · | — )/);
  if(parts.length > 1){ let hit = false;
    const out = parts.map(p => { const t = D[p] != null ? D[p] : null; if(t != null){ hit = true; return t; }
      for(const [re, f] of I18N_PAT){ const m = p.match(re); if(m && f[LANG]){ hit = true; return f[LANG](m, D); } } return p; });
    if(hit) return out.join(""); }
  return null;
}
function trNode(n){
  const p = n.parentElement; if(!p || p.closest("script,style,[contenteditable],.lang-seg")) return;
  if(!ORIG.has(n)) ORIG.set(n, n.data);
  const o = ORIG.get(n), k = o.trim();
  let v = o;
  if(LANG !== "en" && k){ const t = trStr(k); if(t != null) v = o.replace(k, t); }
  if(n.data !== v){ n.data = v; ORIG.set(n, o); }
}
function trTree(root){
  if(editing) return;
  if(root.nodeType === 3) return trNode(root);
  const w = document.createTreeWalker(root, NodeFilter.SHOW_TEXT); let n;
  while((n = w.nextNode())) trNode(n);
}
const I18N_OBS = new MutationObserver(ms => { if(editing) return;
  ms.forEach(m => m.type === "characterData" ? (ORIG.delete(m.target), trNode(m.target)) : m.addedNodes.forEach(trTree)); });
function langSync(){
  document.documentElement.lang = LANG === "zh" ? "zh-Hans" : LANG;
  document.querySelectorAll(".lang-seg button").forEach(b => b.setAttribute("aria-pressed", b.dataset.lang === LANG));
}
function setLang(l){
  LANG = l; try{ localStorage.setItem("ml-lang", l); }catch(_){}
  I18N_OBS.disconnect(); trTree(document.body); langSync();
  I18N_OBS.observe(document.body, {childList:true, subtree:true});
}
let THEME = "dark";
try{ if(localStorage.getItem("ml-theme") === "light") THEME = "light"; }catch(_){}
function themeSync(){
  document.documentElement.dataset.theme = THEME;
  document.querySelectorAll(".thm-btn").forEach(b => { b.setAttribute("aria-label", THEME === "dark" ? "Light mode" : "Dark mode"); b.title = b.getAttribute("aria-label"); });
}
document.addEventListener("click", e => {
  const lb = e.target.closest(".lang-seg button");
  if(lb){ setLang(lb.dataset.lang); return; }
  if(e.target.closest(".thm-btn")){ THEME = THEME === "dark" ? "light" : "dark"; try{ localStorage.setItem("ml-theme", THEME); }catch(_){} themeSync(); }
});
new MutationObserver(() => { langSync(); themeSync(); }).observe(document.getElementById("app"), {childList:true});
themeSync(); setLang(LANG);

/* ---------- boot ---------- */
lastWasDetail = S.projects.some(x=>x.id===location.hash.slice(1));
render(true);
(async ()=>{
  if(!window.claude?.use) await new Promise(r=>addEventListener("load", r, {once:true}));
  if(!window.claude?.use) return;
  try{
    const [art, assets] = await Promise.all([claude.use("artifact"), claude.use("assets")]);
    ART = art; ASSETS = assets;   /* assets is only granted to editors, so it doubles as the edit-access signal */
    updateBar();
  }catch(_){}
})();
</script>
